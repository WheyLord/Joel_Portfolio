[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "golf-eval"
version = "0.1.0"
description = "GolfDB eval harness for P-detection validation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "mediapipe>=0.10.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
